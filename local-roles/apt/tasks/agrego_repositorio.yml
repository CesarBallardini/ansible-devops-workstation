---
- name: apt | agrega un repo
  ansible.builtin.deb822_repository:
    name: "apt-{{ un_repo_idx }}-{{ item.key }}"
    types:
      - deb
    uris: "{{ item.value.uri }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}{{ item.value.suffix }}"
    components: "{{ item.value.components }}"
    state: "{{ item.value.state }}"
  loop: "{{ un_repo | dict2items }}"
  become: true
  tags:
    - apt
