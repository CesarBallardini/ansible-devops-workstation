## Workaround: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/issues/36#note_395793123
#
- name: codium | elimina repo legacy (.list)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/codium.list
    state: absent
  become: true
  tags:
    - codium

- name: codium | agrego repo
  ansible.builtin.deb822_repository:
    name: codium
    types:
      - deb
    uris: "https://paulcarroty.gitlab.io/vscodium-deb-rpm-repo/debs/"
    suites:
      - vscodium
    components:
      - main
    architectures:
      - amd64
    signed_by: /usr/share/keyrings/codium.asc
    state: present
    mode: "0644"
  become: true
  register: reg_add_repo_codium
  tags:
    - codium

- name: codium | actualizo lista paquetes .deb despues de agregar repo
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: reg_add_repo_codium is changed
  tags:
    - codium

- name: codium | instala codium
  ansible.builtin.apt:
    name:
      - codium
    state: present
  become: true
  ignore_errors: true # https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/issues/53 Currently, Linux x64 builds are failing (https://github.com/VSCodium/vscodium/issues/632). This apparently means that this repository is empty for the failing versions. When some Codium builds are missing from the latest version, this repo should use the old ones instead of just having an empty repo.
  tags:
    - codium
