---
# See https://github.com/goss-org/goss/releases for release versions

- name: devops | paquetes generales
  ansible.builtin.package:
    name:
      - jq
      - git
      - wget
      - curl
      - unzip
    state: present
  become: true
  tags:
    - devops
    - goss

- name: devops | goss | version actual instalada
  ansible.builtin.shell: |
    LANG=C /usr/local/bin/goss --version 2>&1 | grep -oP 'goss version \Kv[0-9]+\.[0-9]+\.[0-9]+'
  register: reg_goss_version
  failed_when: false
  changed_when: false
  tags:
    - devops
    - goss

- name: devops | goss | busca el nombre de la version actual
  ansible.builtin.shell: |
    curl --silent --fail \
      ${GITHUB_TOKEN:+-H "Authorization: token ${GITHUB_TOKEN}"} \
      https://api.github.com/repositories/43526066/releases/latest \
    | jq -r ".tag_name // empty"
  register: reg_goss_url_version
  changed_when: false
  failed_when: false
  tags:
    - devops
    - goss

- name: devops | goss | set version facts
  ansible.builtin.set_fact:
    goss_version_instalada: "{{ reg_goss_version.stdout if reg_goss_version.rc == 0 and reg_goss_version.stdout is match('^v[0-9]') else '' }}"
    goss_url_version: "{{ reg_goss_url_version.stdout if reg_goss_url_version.stdout is match('^v[0-9]') else '' }}"
  tags:
    - devops
    - goss

- name: devops | goss | warn if version detection failed
  ansible.builtin.debug:
    msg: "WARNING: could not detect latest goss version from GitHub API (rate limit?). Skipping goss install/upgrade."
  when: goss_url_version | length == 0
  tags:
    - devops
    - goss

- name: devops | goss | set download URLs
  ansible.builtin.set_fact:
    goss_version_bare: "{{ goss_url_version | regex_replace('^v', '') }}"
  when: goss_url_version | length > 0
  tags:
    - devops
    - goss

- name: devops | goss | set download URLs
  ansible.builtin.set_fact:
    goss_url_actual: "https://github.com/goss-org/goss/releases/download/{{ goss_url_version }}/goss_{{ goss_version_bare }}_linux_x86_64.tar.gz"
    dgoss_url_actual: "https://github.com/goss-org/goss/releases/download/{{ goss_url_version }}/dgoss"
  when: goss_url_version | length > 0
  tags:
    - devops
    - goss

- name: Show installed version
  ansible.builtin.debug:
    msg: "Goss, version instalada - {{ goss_version_instalada }}"
  tags:
    - devops
    - goss
- name: Show current URL
  ansible.builtin.debug:
    msg: "Goss, url actual        - {{ goss_url_actual | default('N/A') }}"
  tags:
    - devops
    - goss
- name: Show latest version
  ansible.builtin.debug:
    msg: "Goss, latest version    - {{ goss_url_version }}"
  tags:
    - devops
    - goss

- name: devops | goss | descarga paquete
  ansible.builtin.get_url:
    url: "{{ goss_url_actual }}"
    dest: /tmp/goss.tar.gz
    force: true
  become: true
  when: goss_url_version | length > 0 and goss_version_instalada != goss_url_version
  tags:
    - devops
    - goss

- name: devops | goss | extrae binario del tarball
  ansible.builtin.unarchive:
    src: /tmp/goss.tar.gz
    dest: /usr/local/bin/
    include:
      - goss
    remote_src: true
    mode: "0755"
  become: true
  when: goss_url_version | length > 0 and goss_version_instalada != goss_url_version
  tags:
    - devops
    - goss

- name: devops | dgoss | descarga paquete
  ansible.builtin.get_url:
    url: "{{ dgoss_url_actual }}"
    dest: /usr/local/bin/dgoss
    mode: "0755"
    force: true
  become: true
  when: goss_url_version | length > 0 and goss_version_instalada != goss_url_version
  tags:
    - devops
    - goss
