---
- name: mise-en-place | Create keyrings directory if it doesn't exist
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  tags:
    - mise-en-place

- name: mise-en-place | download GPG key
  ansible.builtin.get_url:
    url: "{{ mise_gpg_key_url }}"
    dest: /usr/share/keyrings/mise-archive-keyring.asc
    mode: "0644"
  become: true
  tags:
    - mise-en-place

- name: mise-en-place | convert GPG key to dearmor format
  ansible.builtin.command: gpg --dearmor --yes -o /etc/apt/keyrings/mise-archive-keyring.gpg /usr/share/keyrings/mise-archive-keyring.asc
  args:
    creates: /etc/apt/keyrings/mise-archive-keyring.gpg
  become: true
  tags:
    - mise-en-place

- name: mise-en-place | elimina repo legacy (.list)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/mise-in-place.list
    state: absent
  become: true
  tags:
    - mise-en-place

- name: mise-en-place | Add Mise repository to sources list
  ansible.builtin.deb822_repository:
    name: mise-en-place
    types:
      - deb
    uris: "{{ mise_repo_uri }}"
    suites:
      - "{{ mise_repo_suite }}"
    components:
      - "{{ mise_repo_component }}"
    architectures:
      - amd64
    signed_by: "{{ mise_repo_signed_by }}"
    state: present
  become: true
  register: reg_add_repo_mise
  tags:
    - mise-en-place

- name: mise-en-place | actualizo lista paquetes .deb despues de agregar repo
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: reg_add_repo_mise is changed
  tags:
    - mise-en-place

- name: mise-en-place | Install or update Mise
  ansible.builtin.apt:
    name: mise
    state: latest
  become: true
  tags:
    - mise-en-place
