---
- hosts: devops

  tasks:
    - name: devops | verifica si hay virtualizacion por hardware
      ansible.builtin.command: grep -E "svm|vmx" /proc/cpuinfo
      ignore_errors: true
      changed_when: false
      become: true
      register: hay_virtualizacion_register
      tags:
        - devops
        - virtualbox

    - name: devops | include aws role
      ansible.builtin.include_role:
        name: aws
        apply:
          tags:
            - devops
            - aws
      when: install_aws | bool
      tags:
        - devops
        - aws

    - name: devops | include ansible role
      ansible.builtin.include_role:
        name: ansible
        apply:
          tags:
            - devops
            - ansible
      when: install_ansible | bool
      tags:
        - devops
        - ansible

    - name: devops | include git role
      ansible.builtin.include_role:
        name: git
        apply:
          tags:
            - devops
            - git
      when: install_git | bool
      tags:
        - devops
        - git

    - name: devops | include git_credential_manager role
      ansible.builtin.include_role:
        name: git_credential_manager
        apply:
          tags:
            - devops
            - git_credential_manager
      when: install_git_credential_manager | bool
      tags:
        - devops
        - git_credential_manager

    - name: devops | include terraform role
      ansible.builtin.include_role:
        name: terraform
        apply:
          tags:
            - devops
            - terraform
      when: install_terraform | bool
      tags:
        - devops
        - terraform

    - name: devops | include terraform_docs role
      ansible.builtin.include_role:
        name: terraform_docs
        apply:
          tags:
            - devops
            - terraform
            - terraform_docs
      when: install_terraform_docs | bool
      tags:
        - devops
        - terraform
        - terraform_docs

    - name: devops | include terragrunt role
      ansible.builtin.include_role:
        name: terragrunt
        apply:
          tags:
            - devops
            - terraform
            - terragrunt
      when: install_terragrunt | bool
      tags:
        - devops
        - terraform
        - terragrunt

    - name: devops | include virtualbox role (hardware virtualization available)
      ansible.builtin.include_role:
        name: virtualbox
        apply:
          tags:
            - devops
            - virtualbox
      when:
        - install_virtualbox | bool
        - hay_virtualizacion_register is succeeded
      vars:
        virtualbox_old_packages_to_remove:
          - virtualbox-dkms
          - virtualbox-5.1
          - virtualbox-5.2
          - virtualbox-6.0
          - virtualbox-6.1
          - virtualbox-7.0
          - virtualbox-7.1
        virtualbox_version_to_install: "virtualbox-7.2"
      tags:
        - devops
        - virtualbox

    - name: devops | include virtualbox role (no hardware virtualization)
      ansible.builtin.include_role:
        name: virtualbox
        apply:
          tags:
            - devops
            - virtualbox
      when:
        - install_virtualbox | bool
        - hay_virtualizacion_register is failed
      vars:
        virtualbox_old_packages_to_remove:
          - virtualbox-dkms
          - virtualbox-5.1
          - virtualbox-5.2
          - virtualbox-6.1
          - virtualbox-7.0
          - virtualbox-7.1
        virtualbox_version_to_install: "virtualbox-6.0"
      tags:
        - devops
        - virtualbox

    - name: devops | include vagrant role
      ansible.builtin.include_role:
        name: vagrant
        apply:
          tags:
            - devops
            - vagrant
      when: install_vagrant | bool
      tags:
        - devops
        - vagrant

    - name: devops | include packer role
      ansible.builtin.include_role:
        name: packer
        apply:
          tags:
            - devops
            - packer
      when: install_packer | bool
      tags:
        - devops
        - packer

    - name: devops | include goss role
      ansible.builtin.include_role:
        name: goss
        apply:
          tags:
            - devops
            - goss
      when: install_goss | bool
      tags:
        - devops
        - goss

    - name: devops | include govc role
      ansible.builtin.include_role:
        name: govc
        apply:
          tags:
            - devops
            - govc
      when: install_govc | bool
      tags:
        - devops
        - govc

    - name: devops | include docker role
      ansible.builtin.include_role:
        name: docker
        apply:
          tags:
            - devops
            - docker
      when: install_docker | bool
      tags:
        - devops
        - docker
